<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set new password | SAUTI SAFI</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-page"><div class="auth-card">
<a class="logo" href="index.html"><span class="logo-mark">SS</span><span>SAUTI SAFI</span></a>
<h1 style="margin-top:28px">Set a new password</h1><p>Choose a new password for your account.</p>
<div id="message" class="message"></div>
<form id="resetForm" class="form">
<label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password">
<label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password">
<button class="btn btn-primary" type="submit">Update password</button>
</form>
</div></main>
<script src="app.js"></script><script>
const params = new URLSearchParams(window.location.search);
const resetToken = params.get("token");
const resetForm = document.getElementById("resetForm");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirm");

if (!resetToken) {
  showMessage("message", "Invalid or missing reset token.");
  resetForm.querySelector("button").disabled = true;
}

resetForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (!resetToken) return;
  if (passwordInput.value !== confirmInput.value) {
    showMessage("message", "Passwords do not match.");
    return;
  }

  const button = resetForm.querySelector("button");
  button.disabled = true;
  button.textContent = "Updating...";
  try {
    const data = await api("/auth/reset-password", {
      method: "POST",
      body: JSON.stringify({ token: resetToken, password: passwordInput.value })
    });
    showMessage("message", data.message, "success");
    setTimeout(() => window.location.href = "login.html", 1000);
  } catch (err) {
    showMessage("message", err.message);
    button.disabled = false;
    button.textContent = "Update password";
  }
});
</script></body></html>
