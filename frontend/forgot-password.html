<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password | SAUTI SAFI</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-page"><div class="auth-card">
<a class="logo" href="index.html"><span class="logo-mark">SS</span><span>SAUTI SAFI</span></a>
<h1 style="margin-top:28px">Reset your password</h1><p>Enter your account email. If the account exists, a password reset message will be sent.</p>
<div id="message" class="message"></div>
<form id="forgotForm" class="form">
<label for="email">Email address</label><input id="email" type="email" required autocomplete="email">
<button class="btn btn-primary" type="submit">Send reset link</button>
</form>
<div class="form-links"><a href="login.html">Back to sign in</a><a href="signup.html">Create account</a></div>
</div></main>
<script src="app.js"></script><script>
document.getElementById("forgotForm").addEventListener("submit", async e => {
  e.preventDefault();
  const emailInput = document.getElementById("email");
  const button = e.currentTarget.querySelector("button");
  button.disabled = true;
  button.textContent = "Sending...";
  try {
    const data = await api("/auth/forgot-password", {
      method: "POST",
      body: JSON.stringify({ email: emailInput.value.trim() })
    });
    showMessage("message", data.message, "success");
  } catch (err) {
    showMessage("message", err.message);
  } finally {
    button.disabled = false;
    button.textContent = "Send reset link";
  }
});
</script></body></html>
